<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460">
  <defs>
    <linearGradient id="bgw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1628"/>
      <stop offset="100%" stop-color="#0F1E3A"/>
    </linearGradient>
    <filter id="blurw"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="460" fill="url(#bgw)"/>

  <!-- Ambient glow -->
  <ellipse cx="300" cy="180" rx="180" ry="110" fill="#D4A63A" opacity="0.06" filter="url(#blurw)"/>

  <!-- Gold border -->
  <rect x="1" y="1" width="598" height="458" fill="none" stroke="#D4A63A" stroke-width="1.5" opacity="0.25"/>

  <!-- Browser window -->
  <rect x="60" y="60" width="480" height="300" rx="10" fill="#0E1A2F" stroke="#D4A63A" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Title bar -->
  <rect x="60" y="60" width="480" height="30" rx="10" fill="#142038"/>
  <rect x="60" y="78" width="480" height="12" fill="#142038"/>
  <!-- Traffic lights -->
  <circle cx="82" cy="75" r="5" fill="#FF6058" opacity="0.7"/>
  <circle cx="98" cy="75" r="5" fill="#FFBD2E" opacity="0.7"/>
  <circle cx="114" cy="75" r="5" fill="#28CA42" opacity="0.7"/>
  <!-- URL bar -->
  <rect x="130" y="67" width="280" height="16" rx="8" fill="#0B1628" stroke="#D4A63A" stroke-width="0.8" stroke-opacity="0.3"/>
  <text x="270" y="78.5" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="8" fill="#4A6080">dashboard-familiar.app</text>

  <!-- Sidebar -->
  <rect x="60" y="90" width="80" height="270" fill="#0A1524"/>
  <!-- Sidebar items -->
  <rect x="68" y="102" width="64" height="20" rx="5" fill="#D4A63A" opacity="0.18"/>
  <text x="100" y="115" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#D4A63A" font-weight="700">🏠 Inicio</text>
  <rect x="68" y="128" width="64" height="20" rx="5" fill="#142038"/>
  <text x="100" y="141" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#5A7090">📅 Agenda</text>
  <rect x="68" y="154" width="64" height="20" rx="5" fill="#142038"/>
  <text x="100" y="167" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#5A7090">✅ Tareas</text>
  <rect x="68" y="180" width="64" height="20" rx="5" fill="#142038"/>
  <text x="100" y="193" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#5A7090">🛒 Compra</text>
  <rect x="68" y="206" width="64" height="20" rx="5" fill="#142038"/>
  <text x="100" y="219" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#5A7090">⚙️ Admin</text>

  <!-- Main content -->
  <!-- Clock / date widget -->
  <rect x="152" y="100" width="120" height="50" rx="7" fill="#112035"/>
  <text x="212" y="120" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="18" fill="#D4A63A" font-weight="800">14:32</text>
  <text x="212" y="136" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#5A7090">miércoles, 28 mayo</text>

  <!-- Weather widget -->
  <rect x="282" y="100" width="90" height="50" rx="7" fill="#112035"/>
  <text x="327" y="120" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="16" fill="#D4A63A">⛅</text>
  <text x="327" y="136" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#5A7090">22°C · Madrid</text>

  <!-- Stats -->
  <rect x="382" y="100" width="140" height="50" rx="7" fill="#112035"/>
  <text x="398" y="118" font-family="system-ui,-apple-system,sans-serif" font-size="8" fill="#5A7090">Usuarios</text>
  <text x="398" y="130" font-family="system-ui,-apple-system,sans-serif" font-size="14" fill="#D4A63A" font-weight="800">4</text>
  <text x="450" y="118" font-family="system-ui,-apple-system,sans-serif" font-size="8" fill="#5A7090">Eventos</text>
  <text x="450" y="130" font-family="system-ui,-apple-system,sans-serif" font-size="14" fill="#D4A63A" font-weight="800">12</text>
  <text x="498" y="118" font-family="system-ui,-apple-system,sans-serif" font-size="8" fill="#5A7090">Tareas</text>
  <text x="498" y="130" font-family="system-ui,-apple-system,sans-serif" font-size="14" fill="#D4A63A" font-weight="800">7</text>

  <!-- Kanban board -->
  <text x="155" y="170" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#7A90B0" font-weight="700" letter-spacing="0.05em">KANBAN</text>
  <!-- Pendiente col -->
  <rect x="152" y="178" width="86" height="80" rx="6" fill="#0A1524"/>
  <text x="162" y="191" font-family="system-ui,-apple-system,sans-serif" font-size="8" fill="#5A7090" font-weight="700">Pendiente</text>
  <rect x="158" y="196" width="74" height="18" rx="4" fill="#142038"/>
  <rect x="160" y="199" width="6" height="12" rx="2" fill="#D4A63A" opacity="0.7"/>
  <text x="170" y="209" font-family="system-ui,-apple-system,sans-serif" font-size="8" fill="#8A9BB0">Comprar leche</text>
  <rect x="158" y="218" width="74" height="18" rx="4" fill="#142038"/>
  <rect x="160" y="221" width="6" height="12" rx="2" fill="#D4A63A" opacity="0.7"/>
  <text x="170" y="231" font-family="system-ui,-apple-system,sans-serif" font-size="8" fill="#8A9BB0">Reunión colegio</text>
  <!-- En curso col -->
  <rect x="244" y="178" width="86" height="80" rx="6" fill="#0A1524"/>
  <text x="254" y="191" font-family="system-ui,-apple-system,sans-serif" font-size="8" fill="#5A7090" font-weight="700">En curso</text>
  <rect x="250" y="196" width="74" height="18" rx="4" fill="#142038"/>
  <rect x="252" y="199" width="6" height="12" rx="2" fill="#FFBD2E" opacity="0.7"/>
  <text x="262" y="209" font-family="system-ui,-apple-system,sans-serif" font-size="8" fill="#8A9BB0">Proyecto web</text>
  <!-- Hecho col -->
  <rect x="336" y="178" width="86" height="80" rx="6" fill="#0A1524"/>
  <text x="346" y="191" font-family="system-ui,-apple-system,sans-serif" font-size="8" fill="#5A7090" font-weight="700">Hecho ✓</text>
  <rect x="342" y="196" width="74" height="18" rx="4" fill="#142038"/>
  <rect x="344" y="199" width="6" height="12" rx="2" fill="#28CA42" opacity="0.7"/>
  <text x="354" y="209" font-family="system-ui,-apple-system,sans-serif" font-size="8" fill="#8A9BB0">App Flutter</text>

  <!-- Shopping list -->
  <rect x="432" y="178" width="90" height="80" rx="6" fill="#0A1524"/>
  <text x="442" y="191" font-family="system-ui,-apple-system,sans-serif" font-size="8" fill="#5A7090" font-weight="700">🛒 Compra</text>
  <text x="442" y="205" font-family="system-ui,-apple-system,sans-serif" font-size="8" fill="#8A9BB0">• Leche</text>
  <text x="442" y="217" font-family="system-ui,-apple-system,sans-serif" font-size="8" fill="#8A9BB0">• Pan</text>
  <text x="442" y="229" font-family="system-ui,-apple-system,sans-serif" font-size="8" fill="#8A9BB0">• Paracetamol</text>
  <text x="442" y="241" font-family="system-ui,-apple-system,sans-serif" font-size="8" fill="#4A6080">+ 4 más...</text>

  <!-- Calendar strip -->
  <rect x="152" y="268" width="370" height="42" rx="6" fill="#0A1524"/>
  <text x="162" y="281" font-family="system-ui,-apple-system,sans-serif" font-size="8" fill="#5A7090" font-weight="700">MAYO 2026</text>
  <!-- Day cells -->
  <rect x="158" y="285" width="28" height="18" rx="4" fill="#D4A63A" opacity="0.22"/>
  <text x="172" y="297" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#D4A63A" font-weight="700">28</text>
  <rect x="190" y="285" width="28" height="18" rx="4" fill="#142038"/>
  <text x="204" y="297" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#6A8090">29</text>
  <rect x="222" y="285" width="28" height="18" rx="4" fill="#142038"/>
  <text x="236" y="297" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#6A8090">30</text>
  <rect x="254" y="285" width="28" height="18" rx="4" fill="#142038"/>
  <text x="268" y="297" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#6A8090">31</text>
  <circle cx="270" cy="300" r="2.5" fill="#D4A63A" opacity="0.7"/>

  <!-- PWA badge -->
  <rect x="468" y="320" width="46" height="16" rx="8" fill="#28CA42" opacity="0.15"/>
  <text x="491" y="331" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="8" fill="#28CA42" font-weight="700">PWA ✓</text>

  <!-- Tech badges -->
  <rect x="128" y="388" width="46" height="22" rx="11" fill="#D4A63A" opacity="0.12"/>
  <text x="151" y="403" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#D4A63A" font-weight="700">HTML</text>

  <rect x="182" y="388" width="40" height="22" rx="11" fill="#D4A63A" opacity="0.12"/>
  <text x="202" y="403" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#D4A63A" font-weight="700">CSS</text>

  <rect x="230" y="388" width="30" height="22" rx="11" fill="#D4A63A" opacity="0.12"/>
  <text x="245" y="403" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#D4A63A" font-weight="700">JS</text>

  <rect x="268" y="388" width="42" height="22" rx="11" fill="#28CA42" opacity="0.12"/>
  <text x="289" y="403" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#28CA42" font-weight="700">PWA</text>

  <rect x="318" y="388" width="60" height="22" rx="11" fill="#D4A63A" opacity="0.12"/>
  <text x="348" y="403" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#D4A63A" font-weight="700">Kanban</text>

  <!-- Title -->
  <text x="300" y="432" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#FFFFFF" font-weight="800" letter-spacing="-0.5">Dashboard Familiar Web</text>
  <text x="300" y="452" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#7A90B0">PWA · Kanban · Calendario · Panel admin</text>
</svg>
