<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1628"/>
      <stop offset="100%" stop-color="#0F1E3A"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4A63A" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#D4A63A" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="460" fill="url(#bg)" rx="0"/>

  <!-- Ambient glow top -->
  <ellipse cx="300" cy="60" rx="200" ry="80" fill="#D4A63A" opacity="0.07" filter="url(#blur)"/>

  <!-- Gold border -->
  <rect x="1" y="1" width="598" height="458" fill="none" stroke="#D4A63A" stroke-width="1.5" opacity="0.25"/>

  <!-- Phone outline left -->
  <rect x="100" y="80" width="140" height="240" rx="20" fill="none" stroke="#D4A63A" stroke-width="2" opacity="0.6"/>
  <rect x="112" y="100" width="116" height="186" rx="8" fill="#142038"/>
  <!-- Screen rows (UI skeleton) -->
  <rect x="120" y="108" width="100" height="14" rx="4" fill="#D4A63A" opacity="0.55"/>
  <rect x="120" y="130" width="68" height="9" rx="3" fill="#5A7090" opacity="0.5"/>
  <rect x="120" y="148" width="100" height="38" rx="7" fill="#1B3055"/>
  <rect x="126" y="155" width="30" height="8" rx="3" fill="#D4A63A" opacity="0.4"/>
  <rect x="120" y="194" width="100" height="38" rx="7" fill="#1B3055"/>
  <rect x="126" y="201" width="42" height="8" rx="3" fill="#8EEFD0" opacity="0.35"/>
  <rect x="120" y="240" width="48" height="22" rx="11" fill="#D4A63A" opacity="0.3"/>
  <rect x="176" y="240" width="44" height="22" rx="11" fill="#D4A63A" opacity="0.15"/>
  <circle cx="170" cy="298" r="10" fill="none" stroke="#D4A63A" stroke-width="1.5" opacity="0.4"/>

  <!-- Phone outline right (offset, behind) -->
  <rect x="360" y="100" width="130" height="210" rx="18" fill="none" stroke="#D4A63A" stroke-width="1.5" opacity="0.3"/>
  <rect x="370" y="116" width="110" height="170" rx="7" fill="#0F1A2E" opacity="0.8"/>
  <rect x="378" y="124" width="94" height="12" rx="3" fill="#D4A63A" opacity="0.3"/>
  <rect x="378" y="144" width="94" height="30" rx="5" fill="#162843" opacity="0.9"/>
  <rect x="378" y="182" width="94" height="30" rx="5" fill="#162843" opacity="0.9"/>
  <rect x="378" y="220" width="60" height="20" rx="10" fill="#D4A63A" opacity="0.2"/>

  <!-- Connecting line between phones -->
  <line x1="240" y1="200" x2="360" y2="210" stroke="#D4A63A" stroke-width="1" stroke-dasharray="4 4" opacity="0.2"/>

  <!-- Tech badges -->
  <rect x="100" y="342" width="66" height="22" rx="11" fill="#D4A63A" opacity="0.12"/>
  <text x="133" y="357" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#D4A63A" font-weight="700">Flutter</text>

  <rect x="174" y="342" width="46" height="22" rx="11" fill="#D4A63A" opacity="0.12"/>
  <text x="197" y="357" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#D4A63A" font-weight="700">Dart</text>

  <rect x="228" y="342" width="80" height="22" rx="11" fill="#D4A63A" opacity="0.12"/>
  <text x="268" y="357" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#D4A63A" font-weight="700">local_auth</text>

  <rect x="316" y="342" width="136" height="22" rx="11" fill="#D4A63A" opacity="0.12"/>
  <text x="384" y="357" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#D4A63A" font-weight="700">SharedPreferences</text>

  <!-- Title -->
  <text x="300" y="398" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="26" fill="#FFFFFF" font-weight="800" letter-spacing="-0.5">Family Dashboard</text>
  <text x="300" y="422" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13.5" fill="#7A90B0">App multiplataforma · Flutter · local_auth</text>

  <!-- Coming soon pill -->
  <rect x="222" y="436" width="156" height="18" rx="9" fill="#D4A63A" opacity="0.13"/>
  <text x="300" y="448.5" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10.5" fill="#D4A63A" font-weight="700" letter-spacing="0.08em">CAPTURA PRÓXIMAMENTE</text>
</svg>
